defaultProxyProvider: default
docker:
    local:
        host: unix:///var/run/docker.sock
        targetHostname: 172.31.0.1
        tryDockerInternalNetwork: false
lists: {}
tailscale:
    providers:
        default:
            controlUrl: https://controlplane.tailscale.com
            authKey: "your_key"
    dataDir: /data/
http:
    hostname: 0.0.0.0
    port: 8080
log:
    level: info
    json: false
proxyAccessLog: true
